.name{font:bold 16px Arial,sans-serif;fill:#000;text-anchor:middle}
.field{font:14px Arial,sans-serif;fill:#000}
.link{fill:none;stroke:#000;stroke-width:1.2}
.card{font:13px Arial,sans-serif;fill:#000;text-anchor:middle}
</style>
<!-- tabelas -->
<rect class="tbl" x="130" y="250" width="390" height="250"/><rect class="head" x="130" y="250" width="390" height="44"/><text class="name" x="325" y="278">AUTOR</text>
