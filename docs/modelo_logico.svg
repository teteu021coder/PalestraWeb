<text class="field" x="715" y="251">PK  id_livro : INTEGER</text><text class="field" x="715" y="292">titulo : TEXT NOT NULL</text><text class="field" x="715" y="333">ano_publicacao : INTEGER</text><text class="field" x="715" y="374">quantidade : INTEGER NOT NULL DEFAULT 1</text><text class="field" x="715" y="415">FK  id_autor : INTEGER NOT NULL</text><text class="field" x="715" y="456">CHECK (quantidade &gt;= 0)</text>
