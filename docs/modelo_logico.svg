<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs><pattern id="grade" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c9c9c9"/></pattern></defs>
<rect width="1800" height="1200" fill="#fff"/><rect width="1800" height="1200" fill="url(#grade)"/>
<style>
.tbl{fill:#fff;stroke:#000;stroke-width:1.4}
.head{fill:#fff;stroke:#000;stroke-width:1.4}
