<text class="field" x="155" y="321">PK  id_autor : INTEGER</text><text class="field" x="155" y="362">nome : TEXT NOT NULL</text><text class="field" x="155" y="403">nacionalidade : TEXT</text><text class="field" x="155" y="444">AUTOINCREMENT</text>
<rect class="tbl" x="690" y="180" width="440" height="330"/><rect class="head" x="690" y="180" width="440" height="44"/><text class="name" x="910" y="208">LIVRO</text>
