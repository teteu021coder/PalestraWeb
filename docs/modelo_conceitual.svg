<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs><pattern id="grade" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c9c9c9"/></pattern></defs>
<rect width="1800" height="1200" fill="#fff"/><rect width="1800" height="1200" fill="url(#grade)"/>
<style>
.entity{fill:#fff;stroke:#000;stroke-width:1.5}
.rel{fill:#fff;stroke:#000;stroke-width:1.3}
.attr{fill:#fff;stroke:#000;stroke-width:1.1}
.link{fill:none;stroke:#000;stroke-width:1}
.t{font:16px Arial,sans-serif;fill:#000;text-anchor:middle}
.a{font:14px Arial,sans-serif;fill:#000;text-anchor:middle}
.key{text-decoration:underline}
.card{font:13px Arial,sans-serif;fill:#000;text-anchor:middle}
</style>
<!-- ligações e cardinalidades -->
<path class="link" d="M330 430 L485 430 M595 430 L760 430"/>
<text class="card" x="400" y="417">1</text><text class="card" x="685" y="417">N</text>
<path class="link" d="M950 470 L950 620 L1190 730"/>
<text class="card" x="965" y="520">1</text><text class="card" x="1125" y="690">N</text>
<path class="link" d="M1030 930 L1190 820"/>
<text class="card" x="1080" y="920">1</text><text class="card" x="1160" y="840">N</text>
<!-- entidades -->
<rect class="entity" x="170" y="390" width="160" height="80"/><text class="t" x="250" y="437">AUTOR</text>
<rect class="entity" x="760" y="390" width="190" height="80"/><text class="t" x="855" y="437">LIVRO</text>
<rect class="entity" x="850" y="890" width="180" height="80"/><text class="t" x="940" y="937">USUARIO</text>
<rect class="entity" x="1190" y="730" width="220" height="80"/><text class="t" x="1300" y="777">EMPRESTIMO</text>
<!-- relacionamentos -->
<path class="rel" d="M540 395 L595 430 L540 465 L485 430 Z"/><text class="t" x="540" y="435">ESCREVE</text>
<path class="rel" d="M1080 585 L1135 620 L1080 655 L1025 620 Z"/><text class="t" x="1080" y="625">É DE</text>
<path class="rel" d="M1080 895 L1135 930 L1080 965 L1025 930 Z"/><text class="t" x="1080" y="935">REALIZA</text>
<!-- atributos autor -->
<path class="link" d="M210 390 L160 300 M250 390 L250 275 M290 390 L365 300"/>
<ellipse class="attr" cx="160" cy="280" rx="64" ry="22"/><text class="a key" x="160" y="285">id_autor</text>
<ellipse class="attr" cx="250" cy="250" rx="48" ry="22"/><text class="a" x="250" y="255">nome</text>
<ellipse class="attr" cx="385" cy="280" rx="76" ry="22"/><text class="a" x="385" y="285">nacionalidade</text>
<!-- atributos livro -->
<path class="link" d="M800 390 L740 300 M855 390 L855 270 M910 390 L1000 300 M855 470 L855 540"/>
<ellipse class="attr" cx="740" cy="280" rx="62" ry="22"/><text class="a key" x="740" y="285">id_livro</text>
<ellipse class="attr" cx="855" cy="245" rx="45" ry="22"/><text class="a" x="855" y="250">titulo</text>
<ellipse class="attr" cx="1020" cy="280" rx="76" ry="22"/><text class="a" x="1020" y="285">ano_publicacao</text>
<ellipse class="attr" cx="855" cy="565" rx="62" ry="22"/><text class="a" x="855" y="570">quantidade</text>
<!-- atributos usuario -->
<path class="link" d="M875 970 L790 1045 M940 970 L940 1080 M1005 970 L1090 1045 M850 910 L730 875"/>
<ellipse class="attr" cx="770" cy="1060" rx="65" ry="22"/><text class="a key" x="770" y="1065">id_usuario</text>
<ellipse class="attr" cx="940" cy="1105" rx="48" ry="22"/><text class="a" x="940" y="1110">nome</text>
<ellipse class="attr" cx="1110" cy="1060" rx="48" ry="22"/><text class="a" x="1110" y="1065">email</text>
<ellipse class="attr" cx="700" cy="865" rx="55" ry="22"/><text class="a" x="700" y="870">telefone</text>
<!-- atributos emprestimo -->
<path class="link" d="M1240 730 L1190 635 M1300 730 L1300 625 M1360 730 L1450 650"/>
<ellipse class="attr" cx="1180" cy="610" rx="82" ry="22"/><text class="a key" x="1180" y="615">id_emprestimo</text>
<ellipse class="attr" cx="1330" cy="600" rx="88" ry="22"/><text class="a" x="1330" y="605">data_emprestimo</text>
<ellipse class="attr" cx="1510" cy="650" rx="82" ry="22"/><text class="a" x="1510" y="655">data_devolucao</text>
</svg>